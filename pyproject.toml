[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ml-systems-blueprint"
version = "0.1.0"
description = "A production-minded ML starter repo: reproducible experiments, CLI, tests, linting, and CI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mamoun Yosef" }]
keywords = ["machine-learning", "mlops", "template", "scikit-learn"]

dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "typer>=0.12",
  "rich>=13.7",
  "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.8",
  "pre-commit>=3.7",
]

[project.scripts]
mlsb = "ml_systems_blueprint.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_systems_blueprint"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
strict = false
ignore_missing_imports = true

